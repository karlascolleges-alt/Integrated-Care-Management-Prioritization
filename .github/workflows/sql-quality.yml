name: SQL quality

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install SQLFluff
        run: python -m pip install sqlfluff==3.4.2

      - name: Parse Snowflake SQL
        run: python -m sqlfluff parse --dialect snowflake sql >/dev/null

      - name: Run expected-output tests
        run: python -m unittest discover -s tests -v

              - name: Exercise local pipeline
        run: |
          python -m pipeline.generate_data --patients 100 --output data/raw
          python -m pipeline.run_pipeline --input data/raw --output data/processed/patient_priority_queue.csv
          test "$(($(wc -l < data/processed/patient_priority_queue.csv) - 1))" -eq 100
